spring:
  application:
    name: user-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${USER_DB_NAME:user_db}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}

  liquibase:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${USER_DB_NAME:user_db}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    parameters:
      adminEmail: ${ADMIN_EMAIL}
      adminPasswordHash: ${ADMIN_PASSWORD_HASH}

resilience4j:
  circuitbreaker:
    instances:
      task-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      project-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    hostname: user-service
    prefer-ip-address: false

server:
  port: 0

springdoc:
  api-docs:
    path: /v3/api-docs-user
  swagger-ui:
    config-url: /v3/api-docs-user/swagger-config
    url: /v3/api-docs-user
    urls:
      - url: /v3/api-docs-user
        name: User Service API
  packages-to-scan: com.example.colaba.user.controller
