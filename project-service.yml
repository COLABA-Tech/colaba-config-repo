spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${PROJECT_DB_NAME:project_db}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      task-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

eureka:
  instance:
    instance-id:
      $${spring.application.name}: $${local.server.port}
    hostname: project-service
    prefer-ip-address: false

server:
  port: 0

springdoc:
  api-docs:
    path: /v3/api-docs-project
  swagger-ui:
    config-url: /v3/api-docs-project/swagger-config
    url: /v3/api-docs-project
    urls:
      - url: /v3/api-docs-project
        name: Project Service API
  packages-to-scan: com.example.colaba.project.controller
