spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service-public
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: user-service-internal
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/internal/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: project-service-public
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/api/projects/**, /api/tags/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: project-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: project-service-internal
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/api/projects/internal/**, /api/tags/internal/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: project-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: task-service-public
              uri: lb://TASK-SERVICE
              predicates:
                - Path=/api/tasks/**, /api/comments/**, /api/task-tags/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: task-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: task-service-internal
              uri: lb://TASK-SERVICE
              predicates:
                - Path=/api/tasks/internal/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: task-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: auth-service-public
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: file-service-public
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/files/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: file-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            - id: file-service-internal
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/api/files/internal/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: file-service
                    statusCodes:
                      - 500
                      - 503
                      - 504

            # === OpenAPI документация ===
            - id: user-openapi-root
              uri: lb://USER-SERVICE
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service,/v3/api-docs-user

            - id: user-openapi-subpaths
              uri: lb://USER-SERVICE
              predicates:
                - Path=/v3/api-docs/user-service/**
              filters:
                - RewritePath=/v3/api-docs/user-service/(?<segment>.*),/v3/api-docs-user/${segment}

            - id: project-openapi-root
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/v3/api-docs/project-service
              filters:
                - RewritePath=/v3/api-docs/project-service,/v3/api-docs-project

            - id: project-openapi-subpaths
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/v3/api-docs/project-service/**
              filters:
                - RewritePath=/v3/api-docs/project-service/(?<segment>.*),/v3/api-docs-project/${segment}

            - id: task-openapi-root
              uri: lb://TASK-SERVICE
              predicates:
                - Path=/v3/api-docs/task-service
              filters:
                - RewritePath=/v3/api-docs/task-service,/v3/api-docs-task

            - id: task-openapi-subpaths
              uri: lb://TASK-SERVICE
              predicates:
                - Path=/v3/api-docs/task-service/**
              filters:
                - RewritePath=/v3/api-docs/task-service/(?<segment>.*),/v3/api-docs-task/${segment}

            - id: auth-openapi-root
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service,/v3/api-docs-auth

            - id: auth-openapi-subpaths
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/v3/api-docs/auth-service/**
              filters:
                - RewritePath=/v3/api-docs/auth-service/(?<segment>.*),/v3/api-docs-auth/${segment}

            - id: file-openapi-root
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/v3/api-docs/file-service
              filters:
                - RewritePath=/v3/api-docs/file-service,/v3/api-docs-file

            - id: file-openapi-subpaths
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/v3/api-docs/file-service/**
              filters:
                - RewritePath=/v3/api-docs/file-service/(?<segment>.*),/v3/api-docs-file/${segment}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      project-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      task-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      auth-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
      file-service:
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

server:
  port: ${API_GATEWAY_PORT:8080}

springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Project Service
        url: /v3/api-docs/project-service
      - name: Task Service
        url: /v3/api-docs/task-service
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: File Service
        url: /v3/api-docs/file-service
    urls-primary-name: User Service
  override-with-gateway-url: true